<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Auditor Lead - Plataforma de evaluación ISO 27001">
  <title>Auditor Lead - ISO 27001</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="navbar" role="banner">
    <nav class="navbar__container" aria-label="Navegación principal">
      <a href="#/" class="navbar__logo">
        <img src="assets/images/iso_27001_lead_auditor.svg" alt="" class="navbar__logo-img">
        <span class="navbar__brand">Auditor Lead</span>
      </a>
      <ul class="navbar__links" role="menubar">
        <li role="none"><a href="#/" role="menuitem" class="navbar__link" data-nav="home">Inicio</a></li>
        <li role="none"><a href="#/acerca" role="menuitem" class="navbar__link" data-nav="acerca">Acerca de</a></li>
        <li role="none"><a href="#/auditorias" role="menuitem" class="navbar__link" data-nav="auditorias">Auditorias</a></li>
        <li role="none"><a href="#/evaluaciones" role="menuitem" class="navbar__link" data-nav="evaluaciones">Evaluaciones</a></li>
      </ul>
      <div class="navbar__actions">
        <button class="theme-toggle" id="theme-toggle" aria-label="Cambiar tema" title="Cambiar modo oscuro/claro">
          <svg class="theme-toggle__sun" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>
          </svg>
          <svg class="theme-toggle__moon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
          </svg>
        </button>
        <div class="navbar__user">
          <div class="navbar__avatar" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="currentColor" width="20" height="20"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
          </div>
          <span class="navbar__username"></span>
        </div>
      </div>
    </nav>
  </header>

  <main id="app" class="main-content" role="main"></main>

  <footer class="footer" role="contentinfo">
    <p>&copy; 2026 Auditor Lead — Plataforma ISO 27001 · Equipo 16 ITESM MNA</p>
  </footer>

  <script src="js/auth.js"></script>
  <script src="js/api.js"></script>
  <script src="js/pages/login.js"></script>
  <script src="js/pages/register.js"></script>
  <script src="js/pages/landing.js"></script>
  <script src="js/pages/auditorias.js"></script>
  <script src="js/pages/auditoria-detalle.js"></script>
  <script src="js/pages/evaluaciones.js"></script>
  <script src="js/pages/acerca.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
