[project]
name = "agentcore-shared"
version = "0.1.0"
description = "Shared modules for the AgentCore ISO 27001 audit multi-agent system"
requires-python = ">=3.12"
dependencies = [
    "boto3==1.35.0",
    "strands-agents==1.13.0",
    "pydantic==2.10.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
