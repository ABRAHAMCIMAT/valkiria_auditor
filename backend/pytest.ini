[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short --strict-markers --import-mode=importlib -m "not e2e"
markers =
    unit: Unit tests (fast, no external deps)
    integration: Integration tests (mock AWS services)
    slow: Tests that take longer than 5s
    e2e: Tests against a deployed environment (real cost, need E2E_* variables)
